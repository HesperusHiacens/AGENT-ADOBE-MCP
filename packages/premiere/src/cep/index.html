<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AGENT-ADOBE-MCP Premiere Bridge</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", sans-serif;
      background: #14161c;
      color: #cbd5e1;
      margin: 0;
      padding: 12px;
      font-size: 12px;
    }
    .row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; flex: 0 0 auto; }
    .dot.on { background: #22d3ee; box-shadow: 0 0 6px #22d3ee; }
    .dot.err { background: #f59e0b; }
    code { color: #94a3b8; font-size: 11px; }
    #log { margin-top: 8px; max-height: 60px; overflow-y: auto; color: #64748b; font-size: 10px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="row"><span class="dot" id="dot"></span><strong>Premiere bridge</strong><span id="state">starting…</span></div>
  <div class="row"><code>127.0.0.1:<span id="port">—</span></code></div>
  <div id="log"></div>

  <!-- CSInterface must load before bridge.js; both are local to the extension. -->
  <script src="./js/CSInterface.js"></script>
  <script src="./js/bridge.js"></script>
</body>
</html>
